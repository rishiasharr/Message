<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For you 🎀</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blush:#fff0f3; --petal:#ffd6e0; --rose:#ff8fab; --berry:#c9184a; --cocoa:#6d2e46; --cream:#fffaf6;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --hand:'Caveat','Segoe Script','Comic Sans MS',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--blush);color:var(--cocoa);font-family:var(--serif);font-size:20px;line-height:1.5;overflow-x:hidden;
  background-image:radial-gradient(circle at 20% 10%,#ffe0e9 0,transparent 40%),radial-gradient(circle at 85% 70%,#ffd0dd 0,transparent 45%);
  background-attachment:fixed}
body.locked{overflow:hidden;height:100vh}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px dashed var(--berry);outline-offset:3px}

/* floating hearts */
#floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#floaters span{position:absolute;bottom:-40px;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
.pop{position:fixed;pointer-events:none;z-index:99;animation:pop 1s ease-out forwards;font-size:22px}
@keyframes pop{to{transform:translate(var(--dx),-90px) scale(1.4);opacity:0}}

/* ---------- ENVELOPE INTRO ---------- */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;
  background:var(--blush);transition:opacity .9s,visibility .9s}
#intro.gone{opacity:0;visibility:hidden}
#intro h1{font-style:italic;font-weight:500;font-size:clamp(26px,6vw,38px);text-align:center;padding:0 20px}
.env{position:relative;width:min(320px,78vw);height:min(210px,52vw);perspective:900px;border:0;background:none;margin-top:70px;animation:bob 3s ease-in-out infinite}
.env.open{animation:none}
@keyframes bob{50%{transform:translateY(-8px)}}
.env .back{position:absolute;inset:0;background:#ffb3c6;border-radius:10px;box-shadow:0 18px 40px rgba(201,24,74,.25)}
.env .paper{position:absolute;left:8%;right:8%;top:8px;height:88%;background:var(--cream);border-radius:6px;z-index:1;
  display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:30px;color:var(--berry);
  transition:transform .9s .55s cubic-bezier(.3,1.3,.5,1)}
.env.open .paper{transform:translateY(-80px)}
.env .front{position:absolute;inset:0;z-index:2;background:#ff9db6;border-radius:10px;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:56%;z-index:3;background:#ff7aa2;transform-origin:top;
  clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .6s,z-index 0s .3s}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env .seal{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;font-size:34px;transition:opacity .3s}
.env.open .seal{opacity:0}
.hint{font-family:var(--hand);font-size:26px;color:var(--berry);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- MAIN ---------- */
main{position:relative;z-index:1}
section{padding:80px 22px;max-width:940px;margin:0 auto;text-align:center}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}
.reveal.show{opacity:1;transform:none}
h2{font-style:italic;font-weight:700;font-size:clamp(32px,7vw,48px);line-height:1.1;margin-bottom:10px}
.sub{font-family:var(--hand);font-size:26px;color:var(--berry);margin-bottom:34px}

#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
#hero .bow{font-size:clamp(70px,18vw,110px);animation:sway 4s ease-in-out infinite;display:inline-block}
@keyframes sway{50%{transform:rotate(8deg) scale(1.06)}}
#hero h1{font-style:italic;font-weight:700;font-size:clamp(46px,13vw,110px);line-height:1;color:var(--berry);margin:8px 0 14px}
#hero p{max-width:30ch;font-size:clamp(20px,4vw,26px)}
.days{display:inline-block;margin-top:22px;font-family:var(--hand);font-size:24px;background:var(--cream);border:2px dashed var(--rose);border-radius:40px;padding:4px 20px;transform:rotate(-2deg)}
.down{margin-top:36px;font-family:var(--hand);font-size:24px;color:var(--berry);animation:pulse 2s infinite}

/* letter */
.letter{background:var(--cream);max-width:620px;margin:0 auto;padding:44px 34px;text-align:left;border-radius:6px;position:relative;
  box-shadow:0 14px 40px rgba(201,24,74,.15);transform:rotate(-1deg);
  background-image:repeating-linear-gradient(transparent 0 33px,#ffe3ea 33px 34px);line-height:34px}
.letter::before{content:"🎀";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:40px;line-height:1}
#typed{white-space:pre-wrap;font-size:22px;min-height:340px}
#typed::after{content:"|";color:var(--rose);animation:pulse .8s infinite}
#typed.done::after{content:""}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px;margin-top:20px}
.note{background:var(--cream);border-radius:18px;padding:26px 20px;font-size:21px;border:2px solid var(--petal);
  box-shadow:0 8px 20px rgba(255,143,171,.25);transition:transform .25s}
.note:nth-child(odd){transform:rotate(-2deg)} .note:nth-child(even){transform:rotate(2deg)}
.note:hover{transform:rotate(0) scale(1.05)}
.note b{display:block;font-family:var(--hand);font-size:28px;color:var(--berry);font-weight:700;margin-bottom:4px}

/* polaroids */
.wall{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 26px;margin-top:20px}
.polaroid{width:min(240px,78vw);background:#fff;padding:12px 12px 14px;box-shadow:0 10px 26px rgba(109,46,70,.2);border:0;position:relative;
  transform:rotate(var(--r));transition:transform .3s;text-align:center}
.polaroid:hover{transform:rotate(0) scale(1.07);z-index:3}
.polaroid::before{content:"";position:absolute;top:-12px;left:50%;width:78px;height:24px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,143,171,.55)}
.polaroid .ph{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--petal)}
.polaroid .ph.empty{display:flex;align-items:center;justify-content:center;font-size:54px}
.polaroid figcaption{font-family:var(--hand);font-size:25px;color:var(--cocoa);margin-top:10px;line-height:1.1}
#lightbox{position:fixed;inset:0;z-index:80;background:rgba(109,46,70,.8);display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:12px}
#lightbox.on{display:flex}
#lightbox img{max-width:92vw;max-height:78vh;border:12px solid #fff;border-bottom-width:44px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#lightbox p{font-family:var(--hand);font-size:28px;color:#fff}

/* receipt */
.receipt{max-width:340px;margin:10px auto 0;background:#fff;padding:28px 24px 34px;text-align:left;font-family:'Courier New',Courier,monospace;font-size:15px;color:#444;
  box-shadow:0 12px 30px rgba(109,46,70,.18);transform:rotate(1.5deg);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%}
.receipt h3{text-align:center;font-size:18px;letter-spacing:2px}
.receipt .c{text-align:center;font-size:12px;color:#999;margin-bottom:10px}
.receipt .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #ddd}
.receipt .total{font-weight:bold;font-size:17px;border-bottom:0;border-top:2px solid #444;margin-top:8px;padding-top:10px;color:var(--berry)}
.receipt .thanks{text-align:center;margin-top:16px;font-size:13px}

/* forgive */
#forgive{padding-bottom:140px}
.q{font-size:clamp(30px,8vw,52px);font-style:italic;font-weight:700;color:var(--berry);margin-bottom:30px}
.btns{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:120px}
.btn{border:0;border-radius:50px;padding:14px 34px;font-size:24px;font-weight:700;transition:transform .2s}
#yes{background:var(--berry);color:#fff;box-shadow:0 8px 20px rgba(201,24,74,.4);font-size:var(--ys,24px)}
#yes:hover{transform:scale(1.08)}
#no{background:var(--petal);color:var(--cocoa)}
#no.run{position:fixed;z-index:30}
#final{position:fixed;inset:0;z-index:90;background:rgba(255,240,243,.96);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
#final.on{display:flex}
#final .big{font-size:80px;animation:sway 2s infinite}
#final h2{color:var(--berry)}
#final p{max-width:26ch;font-size:24px}
footer{text-align:center;padding:0 20px 60px;font-family:var(--hand);font-size:24px;color:var(--berry)}
#music{position:fixed;right:14px;bottom:14px;z-index:60;width:48px;height:48px;border-radius:50%;border:2px solid var(--rose);background:var(--cream);font-size:22px;display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body class="locked">

<div id="floaters"></div>

<!-- Envelope -->
<div id="intro">
  <h1 id="introTitle"></h1>
  <button class="env" id="env" aria-label="Open the letter">
    <div class="back"></div>
    <div class="paper">for you 💌</div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">💗</div>
  </button>
  <div class="hint">tap the envelope</div>
</div>

<main>
  <section id="hero">
    <div class="bow">🎀</div>
    <h1>I’m sorry</h1>
    <p id="heroLine"></p>
    <div class="days" id="days" hidden></div>
    <div class="down">scroll down, there’s more ↓</div>
  </section>

  <section id="letterSec" class="reveal">
    <h2>A letter for you</h2>
    <div class="sub">please read it till the end</div>
    <div class="letter"><div id="typed"></div></div>
  </section>

  <section class="reveal">
    <h2>Little reminders</h2>
    <div class="sub">for whenever you need them</div>
    <div class="notes" id="notes"></div>
  </section>

  <section class="reveal">
    <h2>Us, my favourite thing</h2>
    <div class="sub">tap a photo to look closer</div>
    <div class="wall" id="wall"></div>
  </section>

  <section class="reveal">
    <h2>Official apology receipt</h2>
    <div class="sub">fully paid, no refunds</div>
    <div class="receipt" id="receipt"></div>
  </section>

  <section id="forgive" class="reveal">
    <div class="q" id="question"></div>
    <div class="btns" id="btns">
      <button class="btn" id="yes">Yes 🥹</button>
      <button class="btn" id="no">No</button>
    </div>
  </section>

  <footer id="signoff"></footer>
</main>

<div id="lightbox"><img alt=""><p></p></div>
<div id="final">
  <div class="big">🥰</div>
  <h2 id="finalTitle"></h2>
  <p id="finalText"></p>
</div>
<button id="music" aria-label="Toggle music">🎵</button>

<script>
/* ============================================================
   EDIT THIS PART ONLY  (name, messages, photos)
   Use {her} and {me} anywhere, they get replaced automatically.
   ============================================================ */
const CONFIG = {
  her: "Baby Ranz",                      // her name or nickname
  me: "Your Rishi",                 // how you sign off
  startDate: "2026-01-01",          // the day you got together (YYYY-MM-DD), or "" to hide
  music: "By My Side.mp3",                        // e.g. "song.mp3" (put the file next to index.html), or "" for none

  heroLine: "I made this little corner of the internet just for you, {her}.",

  letter:
`Dear {her},

I’m so sorry. I know I hurt you, and I hate that I made you feel even a little bit sad. You deserve so much better, and I want to keep trying to be better for you.

I miss your laugh, your random voice notes, and the way you steal my hoodie. Nothing feels right when you’re upset with me.

Whatever happens, please remember this: I’m here. Always. On the good days and on the messy ones too.

Yours, always,
{me} 🎀`,

  reminders: [
    { t: "I’m here", m: "Whenever you want to talk, rant, cry or laugh. Day or night." },
    { t: "You matter", m: "To me you’re never an afterthought. You’re the first thing I think of." },
    { t: "I’m listening", m: "Not just to reply, but to really understand you." },
    { t: "No more hiding", m: "I’ll tell you what I feel and I’ll hear what you feel." },
    { t: "Proud of you", m: "For every little thing you do, even the ones you think nobody notices." },
    { t: "Still choosing you", m: "Today, tomorrow, and on every ordinary day after." }
  ],

  // Put your photos in a folder called "photos" and name them 1.jpg, 2.jpg ... (change captions below)
  photos: [
    { src: "photos/1.jpg", cap: "our first picture 🤍" },
    { src: "photos/2.jpg", cap: "that silly day" },
    { src: "photos/3.jpg", cap: "my favourite smile" },
    { src: "photos/4.jpg", cap: "you + me" },
    { src: "photos/5.jpg", cap: "best memory ✨" },
    { src: "photos/6.jpg", cap: "us being us" },
    { src: "photos/7.jpg", cap: "forever kind of day" },
    { src: "photos/8.jpg", cap: "more of this please" }
  ],

  receipt: [
    ["1x Sincere sorry", "FREE"],
    ["5x Extra long hugs", "PAID"],
    ["1x Your favourite snack", "ON ME"],
    ["Same mistake again", "0"],
    ["Listening skills", "UPGRADED"]
  ],
  receiptTotal: "ALL MY LOVE",

  question: "Will you forgive me, {her}?",
  dodgeLines: ["No", "Are you sure?", "Really sure?", "Think again 🥺", "Pretty please?", "I’ll bring chocolate", "Don’t do this to me", "Okay, just press Yes 😭"],

  finalTitle: "Thank you, {her}",
  finalText: "I promise to hold your heart carefully. I love you, today and always. 💗",
  signoff: "made with love, just for you 🎀"
};
/* ============================================================ */

const $ = s => document.querySelector(s);
const fill = s => s.replaceAll("{her}", CONFIG.her).replaceAll("{me}", CONFIG.me);

/* text */
$("#introTitle").textContent = fill("A little something for you, " + "{her}");
$("#heroLine").textContent = fill(CONFIG.heroLine);
$("#question").textContent = fill(CONFIG.question);
$("#finalTitle").textContent = fill(CONFIG.finalTitle);
$("#finalText").textContent = fill(CONFIG.finalText);
$("#signoff").textContent = CONFIG.signoff;

/* days together */
if (CONFIG.startDate) {
  const d = Math.floor((Date.now() - new Date(CONFIG.startDate)) / 864e5);
  if (d > 0) { const e = $("#days"); e.hidden = false; e.textContent = d + " days of us, and I’d choose every one again"; }
}

/* notes */
$("#notes").innerHTML = CONFIG.reminders.map(r => `<div class="note"><b>${r.t}</b>${fill(r.m)}</div>`).join("");

/* polaroids */
const wall = $("#wall");
CONFIG.photos.forEach((p, i) => {
  const f = document.createElement("figure");
  f.className = "polaroid";
  f.style.setProperty("--r", ((i % 2 ? 1 : -1) * (1.5 + (i * 1.7) % 4)) + "deg");
  f.tabIndex = 0;
  const img = new Image();
  img.className = "ph"; img.src = p.src; img.alt = p.cap; img.loading = "lazy";
  img.onerror = () => { const ph = document.createElement("div"); ph.className = "ph empty"; ph.textContent = "🎀"; img.replaceWith(ph); f.dataset.empty = "1"; };
  const c = document.createElement("figcaption"); c.textContent = p.cap;
  f.append(img, c);
  const open = () => {
    if (f.dataset.empty) return;
    const lb = $("#lightbox"); lb.querySelector("img").src = p.src; lb.querySelector("p").textContent = p.cap; lb.classList.add("on");
  };
  f.onclick = open; f.onkeydown = e => { if (e.key === "Enter") open(); };
  wall.append(f);
});
$("#lightbox").onclick = () => $("#lightbox").classList.remove("on");

/* receipt */
$("#receipt").innerHTML =
  `<h3>SORRY &amp; CO.</h3><div class="c">${new Date().toLocaleDateString()} · customer: ${CONFIG.her}</div>` +
  CONFIG.receipt.map(r => `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("") +
  `<div class="row total"><span>TOTAL</span><span>${CONFIG.receiptTotal}</span></div>` +
  `<div class="thanks">thank you for being you ♡<br>please come again (forever)</div>`;

/* floating hearts */
const FL = ["🩷", "🎀", "✨", "💗", "🌸", "🤍"];
for (let i = 0; i < 16; i++) {
  const s = document.createElement("span");
  s.textContent = FL[i % FL.length];
  s.style.left = Math.random() * 100 + "vw";
  s.style.fontSize = 14 + Math.random() * 22 + "px";
  s.style.animationDuration = 12 + Math.random() * 14 + "s";
  s.style.animationDelay = -Math.random() * 20 + "s";
  $("#floaters").append(s);
}

/* tap sparkles */
document.addEventListener("pointerdown", e => {
  const s = document.createElement("span");
  s.className = "pop"; s.textContent = FL[Math.floor(Math.random() * FL.length)];
  s.style.left = e.clientX - 10 + "px"; s.style.top = e.clientY - 10 + "px";
  s.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
  document.body.append(s); setTimeout(() => s.remove(), 1000);
});

/* envelope */
$("#env").onclick = function () {
  if (this.classList.contains("open")) return;
  this.classList.add("open");
  setTimeout(() => { $("#intro").classList.add("gone"); document.body.classList.remove("locked"); startMusic(); }, 2100);
};

/* scroll reveal + typewriter */
let typed = false;
const io = new IntersectionObserver(es => es.forEach(en => {
  if (!en.isIntersecting) return;
  en.target.classList.add("show");
  if (en.target.id === "letterSec" && !typed) { typed = true; typeIt(); }
}), { threshold: .25 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

function typeIt() {
  const text = fill(CONFIG.letter), el = $("#typed"); let i = 0;
  (function step() {
    el.textContent = text.slice(0, ++i);
    if (i < text.length) setTimeout(step, 32); else el.classList.add("done");
  })();
}

/* forgive buttons */
let dodges = 0;
const no = $("#no"), yes = $("#yes");
function dodge(e) {
  e.preventDefault();
  dodges++;
  no.textContent = CONFIG.dodgeLines[Math.min(dodges, CONFIG.dodgeLines.length - 1)];
  no.classList.add("run");
  const w = no.offsetWidth, h = no.offsetHeight;
  no.style.left = Math.random() * (innerWidth - w - 20) + 10 + "px";
  no.style.top = Math.random() * (innerHeight - h - 20) + 10 + "px";
  yes.style.setProperty("--ys", Math.min(24 + dodges * 4, 48) + "px");
}
no.addEventListener("mouseenter", dodge);
no.addEventListener("touchstart", dodge, { passive: false });
no.addEventListener("click", dodge);

yes.onclick = () => {
  $("#final").classList.add("on");
  for (let i = 0; i < 70; i++) setTimeout(() => {
    const s = document.createElement("span");
    s.textContent = FL[i % FL.length];
    Object.assign(s.style, { position: "fixed", zIndex: 100, pointerEvents: "none", top: "-30px", left: Math.random() * 100 + "vw", fontSize: 18 + Math.random() * 26 + "px", transition: "transform 3.5s linear, opacity 3.5s", opacity: 1 });
    document.body.append(s);
    requestAnimationFrame(() => { s.style.transform = `translateY(${innerHeight + 80}px) rotate(${Math.random() * 360}deg)`; s.style.opacity = .2; });
    setTimeout(() => s.remove(), 3600);
  }, i * 45);
};

/* music (optional) */
let audio;
function startMusic() {
  if (!CONFIG.music) return;
  audio = new Audio(CONFIG.music); audio.loop = true; audio.volume = .5;
  const b = $("#music"); b.style.display = "block";
  audio.play().catch(() => { b.textContent = "🔇"; });
  b.onclick = () => { if (audio.paused) { audio.play(); b.textContent = "🎵"; } else { audio.pause(); b.textContent = "🔇"; } };
}
</script>
</body>
</html>
